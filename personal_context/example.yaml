# ============================================================
# Personal Context 模板（复制成 context.yaml 再填写）
#
# 这个文件是「你现在在做什么」，不是知识库。
#   - 它不进 SQLite、不进 Chroma、不进那 14303 个 chunk；
#   - 不算 embedding，不做向量检索；
#   - 程序只读不写：改这里、保存、再提问就会生效，系统不会自己改它。
#
# 填写规则
#   - 不确定的字段留空（写 ""），不要编造。空字段不会被渲染进 Prompt，
#     系统会如实回答「缺少这方面的信息」。
#   - 列表字段写 [] 或者按注释的样子写多行。
#   - 多出来的字段会被忽略并在调试信息里报一条告警——加自己的备注没问题，
#     但程序不会用它做任何判断。
#   - 字段名拼错等于没填：同样只会被忽略并告警，不会让系统报错。
# ============================================================

# ---- 个人档案：你是谁、现在往哪个方向走、手上有什么能力 ----
profile:
  background: ""            # 例："华工机械与汽车工程学院，安全工程"
  current_direction: ""     # 例："AI 应用开发 / RAG 系统"
  skills: []                # 例：["Python", "RAG", "FastAPI"]

# ---- 目标：长期 / 当前 / 近期，粒度不同，别混写 ----
goals:
  long_term: ""             # 半年以上
  current: ""               # 这个季度正在推的事
  near_term: ""             # 这周 / 这几天要做完的

# ---- 项目：每个项目一条。name 是必填项，其它字段可以留空 ----
projects:
  - name: "项目名（必填，不要留空）"
    status: ""              # 例："进行中：底座已完成，正在调评测"
    priority: ""            # 例："高"
    next_step: ""           # 例："跑一遍 personal advisor 评测"
    blockers: []            # 例：["缺少人工标注的评测集"]

# ---- 约束：什么会限制你的选择 ----
constraints:
  time: ""                  # 例："每天 2 小时，晚上 21:00 以后"
  resources: ""             # 例："一台 6GB 显存的笔记本，预算有限"
  hard_constraints: []      # 例：["不能改动已有的 Obsidian Vault"]

# ---- 决策偏好：你做选择时一贯的原则，直接写句子 ----
decision_preferences: []
# 例：
#   - "优先把已有的东西做完，而不是同时开新坑"
#   - "能验证的结论比感觉可靠"
#   - "不为假想的未来需求提前做抽象"
