name: LangChain migration smoke tests

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/langchain-migration.yml"
  push:
    branches:
      - "refactor/langchain-core-migration-20261011"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "langchain>=1.0,<2.0" "langchain-core>=1.0,<2.0" "langchain-chroma>=1.0,<2.0" \
            "fastapi>=0.115" "httpx>=0.27" "pydantic-settings>=2" "pyyaml>=6" "numpy>=1.26" "pytest>=8"
      - name: Run adapter and existing retrieval regression tests
        run: |
          python -m pytest tests/test_langchain_integration.py tests/test_retrieval.py tests/test_chunker.py -q
